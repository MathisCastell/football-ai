<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace admin — FOOTBALL.AI</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10; --bg2: #0f1218; --bg3: #161b24;
    --border: rgba(255,255,255,0.08);
    --accent: #00e5a0; --accent2: #ff4b6e; --accent3: #4b8fff;
    --text: #e8eaf0; --muted: #8a90a0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }
  a { color:inherit; text-decoration:none; }

  header { position:sticky; top:0; z-index:10; background:rgba(10,12,16,.92); backdrop-filter:blur(16px); border-bottom:1px solid var(--border); padding:0 1.5rem; }
  .header-inner { max-width:1100px; margin:0 auto; height:60px; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:1.4rem; letter-spacing:.05em; display:flex; align-items:center; gap:.5rem; }
  .logo span { color:var(--accent); }
  .logo-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); }
  .header-nav { display:flex; gap:.5rem; align-items:center; font-size:.85rem; }
  .header-nav a, .header-nav button { color:var(--muted); background:none; border:none; cursor:pointer; font-family:inherit; font-size:.85rem; padding:.4rem .7rem; border-radius:8px; }
  .header-nav a:hover, .header-nav button:hover { color:var(--text); background:var(--bg3); }

  main { max-width:1100px; margin:0 auto; padding:2rem 1.5rem; }
  h1 { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; letter-spacing:.03em; margin-bottom:1.5rem; }

  .panel { background:var(--bg2); border:1px solid var(--border); border-radius:16px; margin-bottom:1.5rem; overflow:hidden; }
  .panel-header { padding:1.1rem 1.4rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.5rem; }
  .panel-title { font-family:'Bebas Neue',sans-serif; font-size:1.05rem; letter-spacing:.05em; }
  .badge { font-size:.7rem; background:var(--bg3); border:1px solid var(--border); border-radius:999px; padding:.25rem .7rem; color:var(--muted); }

  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th, td { text-align:left; padding:.75rem 1.4rem; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; }
  tr:last-child td { border-bottom:none; }
  .table-scroll { overflow-x:auto; }

  .pill { display:inline-flex; align-items:center; gap:.3rem; font-size:.72rem; padding:.25rem .6rem; border-radius:999px; }
  .pill.on { background:rgba(0,229,160,.12); color:var(--accent); }
  .pill.off { background:var(--bg3); color:var(--muted); }

  .toggle-btn { font-size:.75rem; padding:.35rem .7rem; border-radius:8px; border:1px solid var(--border); background:var(--bg3); color:var(--text); cursor:pointer; margin-right:.4rem; }
  .toggle-btn:hover { border-color:rgba(255,255,255,.25); }
  .toggle-btn.danger { color:var(--accent2); }

  .msg-body { max-width:340px; white-space:normal; color:var(--muted); }
  .empty { padding:2rem 1.4rem; text-align:center; color:var(--muted); font-size:.85rem; }

  @media(max-width:700px){
    th, td { padding:.65rem .9rem; }
    .msg-body { max-width:180px; }
  }
  @media(max-width:420px){
    .logo { font-size:1.15rem; }
    .header-nav { gap:.2rem; }
    .header-nav a, .header-nav button { padding:.35rem .5rem; font-size:.78rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo"><div class="logo-dot"></div>FOOTBALL<span>.AI</span> ADMIN</div>
    <div class="header-nav">
      <a href="/app">Dashboard</a>
      <button onclick="doLogout()">Déconnexion</button>
    </div>
  </div>
</header>

<main>
  <h1>Espace admin</h1>

  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">Pipeline</div>
      <span class="badge" id="pipeline-status">—</span>
    </div>
    <div style="padding:1.4rem;">
      <button class="toggle-btn" id="refresh-btn" onclick="triggerRefresh()">↻ Lancer une collecte + recalcul maintenant</button>
      <span id="refresh-msg" style="font-size:.8rem;color:var(--muted);margin-left:.75rem;"></span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">Utilisateurs</div>
      <span class="badge" id="users-count">—</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Email</th><th>Statut</th><th>Créé le</th><th>Dernière connexion</th><th>Actions</th></tr></thead>
        <tbody id="users-body"><tr><td colspan="5" class="empty">Chargement...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">Messages de support</div>
      <span class="badge" id="support-count">—</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Date</th><th>Nom</th><th>Email</th><th>Message</th><th>Statut</th><th></th></tr></thead>
        <tbody id="support-body"><tr><td colspan="6" class="empty">Chargement...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script>
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('fr-FR', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
}

async function doLogout() {
  await fetch('/auth/logout', {method:'POST'});
  location.href = '/';
}

async function triggerRefresh() {
  const btn = document.getElementById('refresh-btn');
  const msg = document.getElementById('refresh-msg');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/refresh');
    const data = await resp.json();
    msg.textContent = data.message || '';
  } catch (e) {
    msg.textContent = 'Erreur';
  } finally {
    setTimeout(() => { btn.disabled = false; loadStatus(); }, 800);
  }
}

async function loadStatus() {
  const data = await fetch('/api/status').then(r => r.json());
  document.getElementById('pipeline-status').textContent =
    data.status === 'running' ? 'En cours...' : (data.last_update ? 'Dernière exécution : ' + fmtDate(data.last_update) : 'Jamais exécuté');
}

async function loadUsers() {
  const resp = await fetch('/api/admin/users');
  if (!resp.ok) { document.getElementById('users-body').innerHTML = '<tr><td colspan="5" class="empty">Accès refusé.</td></tr>'; return; }
  const data = await resp.json();
  document.getElementById('users-count').textContent = data.users.length + ' compte(s)';
  document.getElementById('users-body').innerHTML = data.users.map(u => `
    <tr>
      <td>${escapeHtml(u.email)}</td>
      <td>
        <span class="pill ${u.is_premium ? 'on' : 'off'}">${u.is_premium ? 'Premium' : 'Gratuit'}</span>
        ${u.is_admin ? '<span class="pill on">Admin</span>' : ''}
      </td>
      <td>${fmtDate(u.created_at)}</td>
      <td>${fmtDate(u.last_login_at)}</td>
      <td>
        <button class="toggle-btn" onclick="toggleUser(${u.id}, 'is_premium', ${!u.is_premium})">${u.is_premium ? 'Retirer premium' : 'Passer premium'}</button>
        <button class="toggle-btn ${u.is_admin ? 'danger' : ''}" onclick="toggleUser(${u.id}, 'is_admin', ${!u.is_admin})">${u.is_admin ? 'Retirer admin' : 'Passer admin'}</button>
      </td>
    </tr>`).join('');
}

async function toggleUser(id, field, value) {
  const resp = await fetch(`/api/admin/users/${id}`, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({[field]: value})
  });
  const data = await resp.json();
  if (!resp.ok) { alert(data.error || 'Erreur'); return; }
  loadUsers();
}

async function loadSupport() {
  const resp = await fetch('/api/admin/support');
  if (!resp.ok) { document.getElementById('support-body').innerHTML = '<tr><td colspan="6" class="empty">Accès refusé.</td></tr>'; return; }
  const data = await resp.json();
  document.getElementById('support-count').textContent = data.messages.length + ' message(s)';
  if (!data.messages.length) {
    document.getElementById('support-body').innerHTML = '<tr><td colspan="6" class="empty">Aucun message.</td></tr>';
    return;
  }
  document.getElementById('support-body').innerHTML = data.messages.map(m => `
    <tr>
      <td>${fmtDate(m.created_at)}</td>
      <td>${escapeHtml(m.name)}</td>
      <td>${escapeHtml(m.email)}</td>
      <td class="msg-body">${escapeHtml(m.message)}</td>
      <td><span class="pill ${m.status === 'open' ? 'off' : 'on'}">${m.status === 'open' ? 'Ouvert' : 'Résolu'}</span></td>
      <td>${m.status === 'open' ? `<button class="toggle-btn" onclick="resolveSupport(${m.id})">Marquer résolu</button>` : ''}</td>
    </tr>`).join('');
}

async function resolveSupport(id) {
  await fetch(`/api/admin/support/${id}`, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({status: 'resolved'})
  });
  loadSupport();
}

loadStatus();
loadUsers();
loadSupport();
setInterval(loadStatus, 5000);
</script>
</body>
</html>
