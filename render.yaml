services:
  - type: web
    name: football-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 1 --threads 8 --timeout 120
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: football-ai-db
          property: connectionString
      - key: PIPELINE_INTERVAL_HOURS
        value: "6"
      - key: MIN_SAMPLES_FOR_CALIBRATION
        value: "40"
      - key: FOOTBALL_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FREE_COMPETITIONS
        value: "Premier League,Ligue 1"

databases:
  - name: football-ai-db
    plan: free
